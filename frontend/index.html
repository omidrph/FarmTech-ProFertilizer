    <!-- 🔧 تگ Content-Security-Policy از اینجا حذف شد -->
    <!-- ============================================================ -->
    <!-- این تگ meta قبلاً به‌صورت هاردکد فقط "localhost:8000" و
         "localhost:3000" را در connect-src مجاز می‌کرد. چون این HTML
         در زمان build ثابت می‌شود (static)، این مقدار هرگز عوض
         نمی‌شد و روی هر دامنه‌ی پروڈاکشنی (مثل kood.omidrp.ir) باعث
         بلاک‌شدن تمام درخواست‌های API توسط خود مرورگر می‌شد - دقیقاً
         همان خطای Console: "violates ... Content Security Policy".
         خود بک‌اند (main.py) از قبل هدر Content-Security-Policy را با
         connect-src درست و پویا (بر اساس CORS_ORIGINS) از طریق هدر
         HTTP واقعی ارسال می‌کند، پس این کپی دومِ داخل HTML اضافی و
         مضر بود و کامل حذف شد. -->
