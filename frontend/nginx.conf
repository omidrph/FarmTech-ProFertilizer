# frontend/nginx.conf
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ============================================================
        # 🔧 اصلاح اصلی و نهایی مشکل Mixed Content
        # ============================================================
        # قبلاً اینجا "proxy_set_header X-Forwarded-Proto $scheme;" بود.
        # $scheme یعنی پروتکلی که خودِ nginx این درخواست را رویش دریافت
        # کرده - و چون Traefik (که SSL/HTTPS واقعی کاربر را ترمینیت
        # می‌کند) به nginx از طریق شبکه‌ی داخلی داکر و با HTTP ساده وصل
        # می‌شود، $scheme همیشه برابر "http" بود، حتی وقتی کاربر واقعی
        # از https:// استفاده می‌کرد. نتیجه: nginx داشت هدر درست
        # X-Forwarded-Proto: https که Traefik از قبل فرستاده بود را با
        # مقدار غلط "http" بازنویسی (override) می‌کرد، و همین هدر غلط
        # به FastAPI می‌رسید. برای همین هیچ‌کدام از اصلاحات سمت
        # uvicorn/FastAPI (--proxy-headers یا میدلور دستی) اثر نداشت -
        # چون از همان نقطه‌ی نگین (nginx) داده‌ی غلط تزریق می‌شد.
        # راه‌حل: به‌جای بازنویسی، همان مقداری که Traefik از قبل در این
        # هدر فرستاده را دست‌نخورده عبور می‌دهیم.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 🔧 اضافه شد: مسیر /health در بک‌اند زیر /api/v1 نیست (در ریشه است)،
    # پس بدون این بلوک، چک اتصال فرانت‌اند (useApi.ts -> checkConnection)
    # به‌جای رسیدن به بک‌اند، به index.html فرانت‌اند برمی‌خورد.
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # همان اصلاح بالا، برای این مسیر هم اعمال شد.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}