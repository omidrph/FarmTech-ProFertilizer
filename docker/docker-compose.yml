version: '3.8'

services:
  # ============================================
  # سرویس PostgreSQL
  # ============================================
  postgres:
    image: postgres:15
    container_name: farmtech-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: farmtech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - farmtech-network

  # ============================================
  # سرویس pgAdmin (مدیریت دیتابیس - اختیاری)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: farmtech-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@farmtech.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - farmtech-network

# ============================================
# شبکه و ولوم‌ها
# ============================================
networks:
  farmtech-network:
    driver: bridge

volumes:
  postgres_data: