services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: farmtech-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-farmtech_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    # پورت 5432 به هاست بایند نمی‌شود - فقط سرویس‌های همین شبکه (backend)
    # به آن دسترسی دارند. برای اتصال از بیرون از SSH tunnel استفاده کنید:
    #   ssh -L 5432:localhost:5432 user@your-server
    expose:
      - "5432"
    networks:
      - farmtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-farmtech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend (FastAPI)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: farmtech-backend
    restart: unless-stopped
    # "ports: - 8000:8000" حذف شد چون باعث تداخل با پورت اشغال‌شده روی
    # هاست Coolify می‌شد. با "expose" فقط داخل شبکه‌ی داکر در دسترس است.
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-farmtech_db}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY باید در Environment Variables تنظیم شود}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - farmtech-network
    healthcheck:
      # این healthcheck همین الان دارد درست کار می‌کند (لاگ‌های بک‌اند
      # هر بار "GET /health - Status: 200" را نشان می‌دهند)، پس دست
      # نخورده باقی می‌ماند.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Frontend (Vue 3) - Production Build
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: farmtech-frontend
    restart: unless-stopped
    # "ports: - 3000:3000" حذف شد به همان دلیل بالا (تداخل پورت روی هاست).
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - farmtech-network
    healthcheck:
      # ============================================================
      # 🔧 اصلاح اصلی: "localhost" به "127.0.0.1" تغییر کرد
      # ============================================================
      # علت واقعیِ خطای "no available server" در Traefik این بود که
      # کانتینر frontend همیشه (unhealthy) می‌ماند. با بررسی مستقیم روی
      # سرور مشخص شد:
      #   - nginx واقعاً و درست روی 0.0.0.0:3000 (IPv4) در حال گوش دادن
      #     بود (تأیید شده با netstat).
      #   - اما healthcheck از "wget http://localhost:3000/" استفاده
      #     می‌کرد، و چون این کانفیگ سفارشی (custom) است، اسکریپت
      #     entrypoint رسمی ایمیج nginx خط "listen [::]:3000;" (یعنی
      #     IPv6) را به آن اضافه نکرد.
      #   - داخل کانتینر (Alpine/musl)، هاست‌نیم "localhost" ابتدا به
      #     آدرس IPv6 لوپ‌بک (::1) resolve می‌شود؛ چون nginx روی IPv6
      #     گوش نمی‌دهد، اتصال بلافاصله با خطای
      #     "Connection refused" رد می‌شد و healthcheck همیشه fail
      #     می‌کرد - حتی وقتی نسخه‌ی IPv4 (127.0.0.1) کاملاً سالم بود.
      # با تغییر صریح به "127.0.0.1"، این ابهام resolve شدن حذف می‌شود
      # و healthcheck واقعاً به همان آدرسی وصل می‌شود که nginx رویش
      # listen می‌کند.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  farmtech-network:
    driver: bridge