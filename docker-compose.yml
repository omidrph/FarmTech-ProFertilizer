services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: farmtech-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-farmtech_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    # پورت 5432 به هاست بایند نمی‌شود - فقط سرویس‌های همین شبکه (backend)
    # به آن دسترسی دارند. برای اتصال از بیرون از SSH tunnel استفاده کنید:
    #   ssh -L 5432:localhost:5432 user@your-server
    expose:
      - "5432"
    networks:
      - farmtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-farmtech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend (FastAPI)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: farmtech-backend
    restart: unless-stopped
    # 🔧 "ports: - 8000:8000" حذف شد. این باعث خطای دیپلوی روی Coolify
    # می‌شد ("Bind for 0.0.0.0:8000 failed: port is already allocated")
    # چون پورت 8000 روی سرور از قبل اشغال بود (خود Coolify یا اپ دیگری
    # از آن استفاده می‌کند). با "expose" فقط داخل شبکه‌ی داکر در دسترس
    # است و Coolify از طریق پراکسی داخلی خودش (Traefik) به آن وصل می‌شود؛
    # دیگر نیازی به بایند مستقیم پورت روی هاست نیست.
    expose:
      - "8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-farmtech_db}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY باید در Environment Variables تنظیم شود}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - farmtech-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # Frontend (Vue 3) - Production Build
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: farmtech-frontend
    restart: unless-stopped
    # 🔧 "ports: - 3000:3000" هم حذف شد به همان دلیل بالا (تداخل پورت
    # روی هاست). این سرویس همان سرویسی است که باید دامنه‌ی اصلی سایت
    # روی آن تنظیم شود؛ لیبل زیر به Coolify می‌گوید کدام سرویس و کدام
    # پورت داخلی باید پشت دامنه/HTTPS قرار بگیرد.
    expose:
      - "3000"
    labels:
      - "coolify.managed=true"
      - "coolify.port=3000"
    depends_on:
      - backend
    networks:
      - farmtech-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  farmtech-network:
    driver: bridge