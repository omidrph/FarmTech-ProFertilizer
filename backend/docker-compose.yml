# ============================================================
# Docker Compose کامل - بک‌اند + دیتابیس
# ============================================================

version: '3.8'

services:
  # ===== سرویس PostgreSQL =====
  postgres:
    image: postgres:15
    container_name: farmtech-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: farmtech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - farmtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== سرویس pgAdmin =====
  pgadmin:
    image: dpage/pgadmin4
    container_name: farmtech-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@farmtech.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - farmtech-network
    restart: unless-stopped

  # ===== سرویس بک‌اند FastAPI =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmtech-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/farmtech_db
      DEBUG: "True"
    volumes:
      - ./backend/app:/app/app
    networks:
      - farmtech-network
    restart: unless-stopped

networks:
  farmtech-network:
    driver: bridge

volumes:
  postgres_data: